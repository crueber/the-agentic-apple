name: Release

# Push a tag like v0.2.0 to build, sign and publish a GitHub release.
# The release carries The-Agentic-Apple-<version>.dmg and its Ed25519 signature
# The-Agentic-Apple-<version>.dmg.sig, which installed copies verify before
# updating. Requires the UPDATE_SIGNING_KEY secret and a committed public key
# in Sources/AgenticCore/Update/UpdateKeys.swift (scripts/generate-update-key.sh).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and signing key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the VERSION file ($FILE_VERSION). Bump VERSION, commit, and tag v$FILE_VERSION."
            exit 1
          fi
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::The UPDATE_SIGNING_KEY secret is empty or missing. Run scripts/generate-update-key.sh once (it sets the secret), then re-push the tag."
            exit 1
          fi
          # Fails if UpdateKeys.trusted is empty or does not contain this key's public half.
          swift scripts/sign-update.swift check Sources/AgenticCore/Update/UpdateKeys.swift

      - name: Self-test (offline)
        run: swift run agentic-selftest

      - name: Build DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}" scripts/make-dmg.sh
          ls -la dist

      - name: Sign DMG
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: swift scripts/sign-update.swift sign "dist/The-Agentic-Apple-${GITHUB_REF_NAME#v}.dmg"

      - name: Verify signature against the committed trusted keys
        run: |
          DMG="dist/The-Agentic-Apple-${GITHUB_REF_NAME#v}.dmg"
          swift scripts/sign-update.swift verify "$DMG" "$DMG.sig" Sources/AgenticCore/Update/UpdateKeys.swift

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="dist/The-Agentic-Apple-$VERSION.dmg"
          NOTES="$(awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} /^## / && f {exit} f' CHANGELOG.md)"
          # Both assets in one call, so a release never exists without its signature.
          gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sig" \
            --title "The Agentic Apple $VERSION" \
            --notes "${NOTES:-See CHANGELOG.md.}"
