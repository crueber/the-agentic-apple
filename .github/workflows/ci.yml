name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Swift version
        run: swift --version
      - name: Self-test (offline)
        run: swift run agentic-selftest
      - name: Build app bundle
        run: scripts/build-app.sh
      - name: Zip app bundle
        # upload-artifact drops the exec bit; ditto keeps permissions, symlinks and the signature.
        run: ditto -c -k --keepParent "dist/The Agentic Apple.app" "dist/The-Agentic-Apple.zip"
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: The-Agentic-Apple
          path: dist/The-Agentic-Apple.zip
